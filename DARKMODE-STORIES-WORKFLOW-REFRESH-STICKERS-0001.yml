name: Refresh Sticker Library

on:
  push:
    paths:
      - "DARKMODE-STORIES-STICKER-*"
      - "DARKMODE-STORIES-GENERATE-STICKER-MANIFEST-0001.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-sticker-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate sticker manifest
        run: python DARKMODE-STORIES-GENERATE-STICKER-MANIFEST-0001.py

      - name: Commit manifest when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DARKMODE-STORIES-STICKER-MANIFEST-0001.json
          if git diff --cached --quiet; then
            echo "Sticker manifest is already current."
          else
            git commit -m "Update sticker manifest"
            git push
          fi
